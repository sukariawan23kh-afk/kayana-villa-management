# ---------------------------------------------------------------------------
# Netlify configuration for KAYANA Villa Management
# ---------------------------------------------------------------------------
# This file tells Netlify how to build and deploy the Next.js app + admin CMS.
# When you connect this repo to Netlify, these settings are auto-applied.

[build]
  # Build the Next.js app. (Netlify's plugin wraps `next build` automatically.)
  command = "next build"
  # Publish directory — the @netlify/plugin-nextjs fills this in, but we
  # declare .next so Netlify knows where the build output lives.
  publish = ".next"

[build.environment]
  # Node version pinned for stability. Netlify supports up to 20.
  NODE_VERSION = "20"
  # Next.js plugin version (auto-installed by Netlify on first deploy).
  NEXT_PLUGIN_VERSION = "^4"

# ---------------------------------------------------------------------------
# Next.js plugin (REQUIRED for App Router + API routes on Netlify)
# ---------------------------------------------------------------------------
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-cache Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# ENVIRONMENT VARIABLES — set these in the Netlify dashboard
# (Site settings → Environment variables), NOT in this file.
# Required for production:
#   DATABASE_PROVIDER = postgresql
#   DATABASE_URL      = postgresql://... (from Neon/Supabase/Prisma Postgres)
#   ADMIN_PASSWORD    = <your-strong-password>
#   ADMIN_SECRET      = <random-long-string>
#   KAYANA_WHATSAPP   = 62...
#   KAYANA_WHATSAPP_DISPLAY = +62 812 ...
#   KAYANA_EMAIL      = hello@kayanavilla.com
# ---------------------------------------------------------------------------

# Redirect rule: ensure /admin/* routes work (plugin handles this, but
# explicit fallback for edge cases).
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
